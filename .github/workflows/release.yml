name: Android 手动发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有版本标签，例如 vpreview-3.9.4'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建签名发布包
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          # 仅构建指定标签的代码，避免误将分支代码发布为该版本。
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: 检查标签与应用版本是否一致
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'发布标签必须为 v{version}')
          PY
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 配置 Android 开发环境
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装 Android SDK
        # 官方仓库中的 API 37 平台包名带有 .0 后缀。
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 配置 Gradle 和构建缓存
        uses: gradle/actions/setup-gradle@v4
      - name: 恢复发布签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少签名密钥配置：$name。请参阅 docs/RELEASING.md。"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: 构建签名发布版 APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --stacktrace
      - name: 校验签名并准备发布附件
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/bdFun-${RELEASE_TAG}.apk"
          cp app/build/outputs/mapping/release/mapping.txt release/mapping.txt
          cd release
          sha256sum -- *.apk > SHA256SUMS.txt
      - name: 上传发布版 APK
        uses: actions/upload-artifact@v7
        with:
          path: release/bdFun-${{ inputs.tag }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: 上传校验文件
        uses: actions/upload-artifact@v7
        with:
          path: release/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: 上传混淆映射文件
        uses: actions/upload-artifact@v7
        with:
          path: release/mapping.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: 清理签名密钥
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.jks"

  publish:
    name: 发布预发布版本
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载发布附件
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
          # APK 本身也是 ZIP 格式，必须保留原文件，避免解包。
          skip-decompress: true
      - name: 核对发布版 APK 校验值
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
      - name: 创建预发布版本或更新已有版本附件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # 保留管理员手动设置的正式版或预发布状态。
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --prerelease --title "bdFun $RELEASE_TAG"
          fi
