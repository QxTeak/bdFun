name: Android 手动发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号：preview-5.1 或 1.1.0（自动计算 versionCode）'
        required: true
        type: string
      notes:
        description: '更新日志（Markdown 列表；支持多行，优先于自动生成）'
        required: false
        type: string
      generate_notes:
        description: '使用 DeepSeek Agent 根据提交自动生成并自审日志'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建签名发布包
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验版本与标签
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          v = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(?:preview-(?:0|[1-9][0-9]?)\.(?:0|[1-9][0-9]?)|(?:0|[1-9][0-9]{0,2})\.(?:0|[1-9][0-9]?)\.(?:0|[1-9][0-9]?))', v):
              raise SystemExit('版本格式无效')
          if subprocess.run(['git', 'rev-parse', '--verify', 'refs/tags/v' + v], capture_output=True).returncode == 0:
              raise SystemExit('版本标签已存在，请使用新版本，避免覆盖已发布 APK')
          PYCODE
      - name: 测试发布日志工具
        run: python3 tools/test-release-notes-agent.py
      - name: 准备更新日志
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          GENERATE_NOTES: ${{ inputs.generate_notes }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python3 tools/release-notes-agent.py
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 配置 Android 开发环境
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: 安装 Android SDK
        # 官方仓库中的 API 37 平台包名带有 .0 后缀。
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: 准备固定 Miuix 源码
        run: python3 tools/setup-miuix.py
      - name: 配置 Gradle 和构建缓存
        uses: gradle/actions/setup-gradle@v4
      - name: 恢复发布签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少签名密钥配置：$name。请参阅 docs/RELEASING.md。"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: 构建签名发布版 APK
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # 输入经环境变量传递，避免日志或版本内容成为 shell 代码。
        run: bash ./gradlew :core:domain:test :infra:bili:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease "-PreleaseVersion=$RELEASE_VERSION" --stacktrace
      - name: 校验签名并准备发布附件
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/bdFun-${RELEASE_TAG}.apk"
          cp release-notes.md release/release-notes.md
          cp app/build/outputs/mapping/release/mapping.txt release/mapping.txt
          cd release
          sha256sum -- *.apk > SHA256SUMS.txt
      - name: 上传发布版 APK
        uses: actions/upload-artifact@v7
        with:
          path: release/bdFun-v${{ inputs.version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: 上传校验文件
        uses: actions/upload-artifact@v7
        with:
          path: release/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: 上传混淆映射文件
        uses: actions/upload-artifact@v7
        with:
          path: release/mapping.txt
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: 上传更新日志
        uses: actions/upload-artifact@v7
        with:
          path: release/release-notes.md
          archive: false
          if-no-files-found: error
      - name: 清理签名密钥
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.jks"

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载发布附件
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
          # APK 本身也是 ZIP 格式，必须保留原文件，避免解包。
          skip-decompress: true
      - name: 核对发布版 APK 校验值
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
      - name: 创建版本标签与 Release
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == vpreview-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/*.apk release/SHA256SUMS.txt release/mapping.txt \
            --target "$RELEASE_SHA" --notes-file release/release-notes.md \
            --title "bdFun $RELEASE_TAG" "${args[@]}"
