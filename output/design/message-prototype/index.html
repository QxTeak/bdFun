<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bdFun · 消息交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9ee;color:#24242b;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,input:focus-visible{outline:2px solid #ed668b;outline-offset:3px}button:hover{filter:brightness(.97)}.studio{max-width:1240px;margin:auto;padding:28px}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font-size:20px;font-weight:750}.brand small{display:block;font-size:12px;font-weight:400;color:#777783;margin-top:6px}.controls{display:flex;flex-wrap:wrap;gap:6px}.controls button{padding:10px 15px;border-radius:12px;background:#f7f7fa}.controls button.active{background:#292930;color:white}.stage{display:flex;justify-content:center;align-items:flex-start}.device{width:390px;height:844px;max-width:100%;background:#f6f6f8;border:1px solid #fff;border-radius:32px;overflow:hidden;box-shadow:0 16px 60px #32324416;display:flex;flex-direction:column;transition:width .25s,height .25s}.device.cover{width:480px;height:780px}.device.wide{width:1080px;height:768px;border-radius:22px}.status{height:34px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:650;flex-shrink:0}.top{height:56px;padding:0 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:1px solid #e8e8ee}.top strong{font-size:17px;flex:1}.icon{height:36px;min-width:36px;border-radius:50%;background:#ededf1;font-size:20px;display:inline-grid;place-items:center}.back{font-size:28px;background:transparent}.layout{display:flex;flex:1;min-height:0}.master{width:100%;overflow:auto;padding:22px 20px 36px}.wide .master{width:340px;flex-shrink:0;border-right:1px solid #e3e3e9}.detail{display:none;flex:1;min-width:0;flex-direction:column}.wide .detail{display:flex}.device:not(.wide).opened .master{display:none}.device:not(.wide).opened .detail{display:flex}.heading{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 22px}.heading h1{font-size:32px;letter-spacing:-1px;margin:0}.muted{color:#95959f;font-size:12px}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:24px;padding:18px 2px;gap:2px;margin-bottom:24px}.shortcut{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:11px;position:relative;padding:0}.glyph{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:650}.green{color:#2cae85;background:#e4f7ef}.pink{color:#ed608b;background:#fff0f5}.blue{color:#4e9dd9;background:#eaf4fe}.orange{color:#e3a03b;background:#fff5df}.badge{background:#f15e86;color:white;font-size:10px;border-radius:12px;min-width:17px;height:17px;display:inline-grid;place-items:center;padding:0 4px}.shortcut .badge{position:absolute;top:-5px;right:14px}.tabs{display:flex;gap:6px;margin:0 0 22px;background:#eeeef3;border-radius:12px;padding:4px}.tabs button{padding:8px 12px;flex:1;border-radius:9px;font-size:12px;white-space:nowrap}.tabs .active{background:white;color:#df517d;box-shadow:0 2px 5px #00000006}.section{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;font-size:12px;color:#898993}.row{width:100%;display:flex;align-items:center;text-align:left;gap:12px;padding:16px 8px;border-radius:16px}.row.selected{background:#fce8ef}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#e3e8f3;color:#66799a;font-size:20px}.avatar.a1{background:#eee3db;color:#ac8063}.avatar.a2{background:#e1eee4;color:#6c9279}.avatar.a3{background:#f5e1e9;color:#bf6a89}.row .text{flex:1;min-width:0}.name{font-size:14px;font-weight:650;margin-bottom:7px}.preview{font-size:12px;color:#91919b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side{text-align:right;display:grid;justify-items:end;gap:8px;font-size:10px;color:#9999a2}.paneltop{display:flex;align-items:center;gap:10px;padding:17px 22px;border-bottom:1px solid #e7e7ed;min-height:64px}.paneltop strong{flex:1}.content{padding:22px;overflow:auto;flex:1}.feed{background:white;border-radius:20px;padding:18px;margin-bottom:12px}.feedhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.feedhead .avatar{width:35px;height:35px;font-size:16px}.feedhead .name{font-size:13px}.feed p{font-size:14px;line-height:1.8;margin:8px 0}.quote{background:#f6f6f8;border-left:2px solid #f287a5;border-radius:2px 9px 9px 2px;padding:12px;font-size:12px;color:#85858f;line-height:1.6}.link{font-size:12px;color:#e85e87;padding:12px 0 0}.video{display:flex;gap:12px;align-items:center;background:#f1f1f5;padding:10px;border-radius:12px;margin:12px 0;font-size:12px;line-height:1.7}.thumb{width:80px;height:50px;border-radius:8px;background:linear-gradient(155deg,#e5bdc0,#9296ad 58%,#535b79);display:grid;place-items:center;color:white;flex-shrink:0}.date{text-align:center;color:#a3a3ad;font-size:11px;margin:12px 0 24px}.bubbleline{display:flex;align-items:flex-start;gap:10px;margin-bottom:22px}.bubbleline.out{flex-direction:row-reverse}.bubble{max-width:74%;background:white;padding:13px 16px;border-radius:4px 18px 18px;line-height:1.8}.out .bubble{background:#fce3ed;border-radius:18px 4px 18px 18px}.bubbleline .avatar{width:32px;height:32px;font-size:14px}.composer{display:flex;align-items:center;gap:8px;padding:14px 18px 22px;border-top:1px solid #e6e6ec;background:#f6f6f8}.composer input{min-width:0;flex:1;border:0;border-radius:24px;background:#eaeaf0;padding:13px 15px;outline-offset:0}.send,.primary{background:#ee638d!important;color:white;border-radius:24px;padding:12px 18px}.empty{height:100%;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;color:#92929d;text-align:center}.empty .symbol{font-size:36px;color:#b9b6c6}.empty strong{color:#575762;font-size:16px}.setting{display:flex;width:100%;padding:20px 16px;background:white;align-items:center;justify-content:space-between;text-align:left;border-bottom:1px solid #f0f0f3}.group{border-radius:20px;overflow:hidden;margin-bottom:22px}.chip{background:#fce5ed;color:#dd587e;padding:10px 14px;border-radius:20px;margin:5px}.field{display:flex;gap:8px;margin-top:18px}.field input{min-width:0;flex:1;padding:12px;border:1px solid #dddde5;border-radius:12px}.footnote{font-size:12px;color:#9999a4;line-height:1.8}.overlay{position:fixed;inset:0;background:#26253244;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.overlay.show{display:flex}.sheet{background:#fafafd;border-radius:26px;padding:24px;width:330px;box-shadow:0 24px 80px #0002}.sheet h3{margin:0 0 16px}.sheet button{width:100%;padding:15px;border-radius:12px;text-align:left}.sheet button:hover{background:#eeeef4}.toast{position:fixed;left:50%;bottom:35px;transform:translateX(-50%);background:#292932;color:white;border-radius:14px;padding:12px 22px;display:none;z-index:20}.notes{max-width:1080px;margin:22px auto 0;display:flex;justify-content:space-between;gap:14px;color:#7d7d89;font-size:12px;line-height:1.8}.scenarios{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.scenarios select{background:#f8f8fb;border:1px solid #dddde5;border-radius:9px;padding:7px;color:#777}.wide .shortcuts{gap:2px}.wide .shortcut{font-size:10px}.wide .shortcut .badge{right:6px}@media(max-width:650px){.studio{padding:14px 8px}.bar{align-items:flex-start;flex-direction:column;padding:0 8px}.notes{padding:0 10px;flex-direction:column}.device.wide{width:100%;height:800px}.wide .master{width:40%;padding:15px 8px}.wide .shortcuts{grid-template-columns:repeat(2,1fr);gap:18px}.wide .row{gap:5px}.wide .row .avatar{display:none}.wide .row .side{display:none}.wide .content{padding:12px}.wide .composer{padding:10px;flex-wrap:wrap}.wide .bubble{max-width:100%}.wide .bubbleline .avatar{display:none}.controls button{padding:9px 11px}}
</style>
</head>
<body>
<main class="studio">
<header class="bar"><div class="brand">bdFun <span style="color:#ed668b">/</span> 消息中心<small>二级页面 · 交互设计提案</small></div><nav class="controls" aria-label="屏幕尺寸"><button data-size="phone" class="active">竖屏</button><button data-size="cover">阔折叠外屏</button><button data-size="wide">宽屏</button></nav></header>
<div class="stage"><section class="device" id="device" aria-label="应用原型"><div class="status"><span>9:41</span><span>▴ ▴ ▰</span></div><header class="top"><button class="icon back" id="back" aria-label="返回上级">‹</button><strong id="title">消息中心</strong><button class="icon" id="read" aria-label="全部已读">✓</button><button class="icon" id="more" aria-label="更多操作">···</button></header><div class="layout"><section class="master" id="master"></section><section class="detail" id="detail" aria-live="polite"></section></div></section></div>
<footer class="notes"><span id="dimensions">390 × 844 dp · 单栏逐级进入，保留列表位置</span><div class="scenarios"><label for="scenario">演示状态</label><select id="scenario"><option value="normal">正常内容</option><option value="empty">空消息</option><option value="error">加载失败</option><option value="loading">加载中</option><option value="guest">未登录</option></select><span>示例数据 · 不连接真实账号</span></div></footer>
</main><div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="操作菜单" id="sheet"></section></div><div class="toast" role="status" id="toast"></div>
<script>
const $=id=>document.getElementById(id), device=$('device');
const people=['林间晚风','影像研究所','小岛同学','哔哩哔哩直播','夜航日记','折纸与手帐'];
const previews=['这个镜头真的好漂亮！','分享视频：把平凡的日子拍成电影','下次一起去拍日落吧','你关注的主播开播啦','谢谢你的喜欢，下期见','[图片]'];
const cats=[['回复我的','↩','green',3],['收到喜欢','♡','pink',12],['@我','@','blue',2],['系统通知','♧','orange',1]];
let size='phone',stack=[],tab=0,read=false,scenario='normal',active=-1,keywords=['广告','推广'],messages={},masterScroll=0,toastTimer,loadingTimer;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=(i=0)=>`<span class="avatar a${i%4}">${['山','映','岛','哔','夜','折'][i%6]}</span>`;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}
function emptyState(){const states={empty:['○','暂无消息','新消息会出现在这里'],error:['!','加载失败','网络暂时不可用，请稍后重试'],loading:['◌','正在加载','请稍候'],guest:['☺','登录后查看消息','与关注的人保持联系']};let a=states[scenario];return `<div class="empty"><div class="symbol">${a[0]}</div><strong>${a[1]}</strong><span>${a[2]}</span>${scenario==='error'?'<button class="primary" data-action="retry">重试</button>':''}${scenario==='guest'?'<button class="primary" data-action="login">模拟登录</button>':''}</div>`}
function renderMaster(){let list=people.map((p,i)=>tab&&i>2?'':`<button class="row ${active===i?'selected':''}" data-chat="${i}">${av(i)}<div class="text"><div class="name">${p}</div><div class="preview">${previews[i]}</div></div><div class="side"><span>${i?'昨天':'10:24'}</span>${!read?`<span class="badge">${i%3+1}</span>`:''}</div></button>`).join('');$('master').innerHTML=`<div class="heading"><h1>消息</h1><span class="muted">${read?'全部已读':'有新的消息'}</span></div><div class="shortcuts">${cats.map((c,i)=>`<button class="shortcut" data-page="${c[0]}"><span class="glyph ${c[2]}">${c[1]}</span><span>${c[0]}</span>${!read?`<span class="badge">${c[3]}</span>`:''}</button>`).join('')}</div><div class="tabs"><button data-tab="0" class="${!tab?'active':''}">全部</button><button data-tab="1" class="${tab?'active':''}">我关注的人</button></div><div class="section"><span>私信</span><button data-page="联系人">联系人 ›</button></div>${scenario==='normal'?list:emptyState()}`;$('master').scrollTop=masterScroll}
function video(){return '<div class="video"><span class="thumb">▶</span><div>把平凡的日子拍成电影<br><span class="muted">06:24 · 视频</span></div></div>'}
function feed(kind){if(scenario!=='normal')return emptyState();if(kind==='系统通知')return ['社区小助手','账号安全提醒'].map((p,i)=>`<div class="date">${i?'昨天':'今天'}</div><article class="feed"><div class="feedhead">${av(i)}<strong>${p}</strong></div><p>${i?'请妥善保管账号信息，避免在不可信的设备上登录。':'你提交的反馈已有回复，点击查看详细处理结果。'}</p><button class="link" data-page="通知详情">查看详情 ›</button></article>`).join('');return `<div class="tabs"><button class="active" data-feedtab="0">${kind==='收到喜欢'?'赞':kind==='回复我的'?'评论':'全部'}</button><button data-feedtab="1">${kind==='收到喜欢'?'新增粉丝':kind==='回复我的'?'弹幕':'我关注的人'}</button></div><div id="feedrows">${feedRows(kind,false)}</div>`}
function feedRows(kind,alt){return [0,1,2].map((i)=>`<article class="feed"><div class="feedhead">${av(i)}<div><div class="name">${people[i]} ${kind==='收到喜欢'?(alt?'关注了你':'等 12 人赞了你的评论'):kind==='@我'?'提到了你':'回复了你'}</div><span class="muted">今天 ${10-i}:24</span></div></div>${kind==='收到喜欢'&&alt?'':`<p>${kind==='@我'?'<span style="color:#e75d85">@我的名字</span> ':''}${['这个构图我也很喜欢。','下次可以试试这个角度～','我也有同感，节奏非常舒服。'][i]}</p><div class="quote">${alt&&kind==='回复我的'?'原弹幕':'原评论'}：原来城市的夜色也可以这么温柔。</div>`}${kind==='收到喜欢'&&!alt?'<button class="link" data-page="点赞详情">查看点赞详情 ›</button>':kind==='回复我的'?`<button class="link" data-reply="${people[i]}">回复</button>`:video()}</article>`).join('')+'<div class="date">没有更多了</div>'}
function openPage(title,id){if(!stack.length)masterScroll=$('master').scrollTop;stack.push({title,id});if(title==='私信'){active=id;renderMaster()}renderDetail()}
function renderDetail(){device.classList.toggle('opened',!!stack.length);let p=stack.at(-1);$('title').textContent=size==='wide'||!p?'消息中心':p.title==='私信'?people[p.id]:p.title;$('read').hidden=!!p&&size!=='wide';if(!p){$('detail').innerHTML='<div class="empty"><span class="symbol">☏</span><strong>从左侧选择一条消息</strong><span>私信、互动与通知，集中查看</span></div>';return}let title=p.title==='私信'?people[p.id]:p.title;let head=`<header class="paneltop">${size==='wide'?'<button class="icon back" data-action="detailback" aria-label="返回消息列表">‹</button>':''}<strong>${title}</strong>${p.title==='私信'?'<button class="icon" data-action="chatmenu" aria-label="聊天设置">···</button>':''}</header>`;let body='';if(cats.some(c=>c[0]===p.title))body=feed(p.title);else if(p.title==='私信'){body=`<div class="date">今天 10:12</div><div class="bubbleline">${av(p.id)}<div class="bubble">上次分享的视频看了吗？</div></div><div class="bubbleline out">${av(2)}<div class="bubble">看了，色彩和转场都很喜欢。</div></div><div class="bubbleline">${av(p.id)}<div class="bubble">${video()}这个镜头真的好漂亮！</div></div>${(messages[p.id]||[]).map(s=>`<div class="bubbleline out">${av(2)}<div class="bubble">${safe(s)}</div></div>`).join('')}`}
else if(p.title==='联系人'||p.title==='黑名单'||p.title==='点赞详情')body=`${p.title==='联系人'?'<div class="tabs"><button class="active" data-contact="关注">关注</button><button data-contact="粉丝">粉丝</button><button data-contact="黑名单">黑名单</button></div>':''}<div id="contacts">${contactRows(p.title==='黑名单'?'黑名单':'关注')}</div>`;
else if(p.title==='消息设置')body='<div class="group">'+['消息提醒','消息屏蔽词','黑名单'].map(x=>`<button class="setting" data-page="${x}">${x}<span>›</span></button>`).join('')+'</div><p class="footnote">原型仅展示信息结构，实际设置项以接口返回为准。</p>';
else if(p.title==='消息屏蔽词')body=`<p class="footnote">包含以下词语的消息将被屏蔽（原型演示）</p><div>${keywords.map((s,i)=>`<button class="chip" data-keyword="${i}">${safe(s)} ×</button>`).join('')}</div><form class="field" id="keywordform"><input aria-label="新屏蔽词" placeholder="输入屏蔽词" maxlength="30"><button class="primary">添加</button></form>`;
else if(p.title==='聊天设置')body='<div class="group"><button class="setting" data-action="block">加入黑名单 <span>›</span></button></div>';
else if(p.title==='消息提醒')body='<div class="feed"><p>此处承载服务端返回的消息提醒选项。</p><p class="footnote">原型未预设开关或修改真实设置。</p></div>';
else if(p.title==='通知详情')body='<article class="feed"><h3>你的反馈已有回复</h3><p>感谢你的反馈，我们已收到并完成处理。</p><p class="footnote">这是一条用于验证通知详情布局的示例消息。</p></article>';
else if(p.title==='上级页面')body='<div class="empty"><span class="symbol">‹</span><strong>已返回消息中心的上级页面</strong><button class="primary" data-action="return">重新进入消息中心</button></div>';
$('detail').innerHTML=head+`<div class="content" id="content">${body}</div>`+(p.title==='私信'?'<form class="composer" id="composer"><button type="button" class="icon" data-action="attach" aria-label="添加图片">＋</button><input name="message" aria-label="私信内容" placeholder="发一条消息" autocomplete="off" maxlength="1000"><button type="button" class="icon" data-action="emoji" aria-label="添加表情">☺</button><button class="send">发送</button></form>':'');if(p.title==='私信')$('content').scrollTop=$('content').scrollHeight}
function contactRows(type){if(type==='黑名单')return '<div class="empty"><span class="symbol">○</span><strong>黑名单为空</strong></div>';return people.slice(0,5).map((p,i)=>`<button class="row" data-chat="${i}">${av(i)}<div class="text"><div class="name">${p}</div><span class="muted">${type==='粉丝'?'关注了你':'互相关注'}</span></div><span>›</span></button>`).join('')}
function back(){if(stack.length){stack.pop();if(!stack.length)active=-1;renderMaster();renderDetail()}else{openPage('上级页面')}}
function modal(title,items){$('sheet').innerHTML=`<h3>${title}</h3>${items.map(([text,action])=>`<button data-menu="${action}">${text}</button>`).join('')}<button data-menu="cancel" style="color:#92929b">取消</button>`;$('overlay').classList.add('show');$('sheet').querySelector('button').focus()}
function closeModal(){$('overlay').classList.remove('show');$('more').focus()}
$('back').onclick=back;$('read').onclick=()=>{read=true;renderMaster();toast('已将所有消息标记为已读')};$('more').onclick=()=>modal('消息操作',[['全部已读','read'],['联系人','联系人'],['消息设置','消息设置']]);
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.size){size=b.dataset.size;device.classList.remove('cover','wide');if(size!=='phone')device.classList.add(size);document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));$('dimensions').textContent={phone:'390 × 844 dp · 单栏逐级进入，保留列表位置',cover:'480 × 780 dp · 阔折叠外屏，保持单栏层级',wide:'1080 × 768 dp · 二级页面内部双栏，无全局导航'}[size];renderDetail()}if(b.dataset.page)openPage(b.dataset.page);if(b.dataset.chat!==undefined)openPage('私信',+b.dataset.chat);if(b.dataset.tab!==undefined){masterScroll=0;tab=+b.dataset.tab;renderMaster()}if(b.dataset.feedtab){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));$('feedrows').innerHTML=feedRows(stack.at(-1).title,b.dataset.feedtab==='1')}if(b.dataset.contact){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));$('contacts').innerHTML=contactRows(b.dataset.contact)}if(b.dataset.keyword!==undefined){keywords.splice(+b.dataset.keyword,1);renderDetail()}if(b.dataset.reply){$('sheet').innerHTML='<h3>回复 '+safe(b.dataset.reply)+'</h3><form id="replyform"><label for="replyinput">回复内容</label><div class="field"><input id="replyinput" aria-label="回复内容" required maxlength="1000" placeholder="写下你的回复"><button class="primary">发送</button></div></form><button data-menu="cancel">取消</button>';$('overlay').classList.add('show');$('replyinput').focus()}if(b.dataset.menu){let a=b.dataset.menu;closeModal();if(a==='read')$('read').onclick();else if(a==='block')toast('已加入黑名单（仅本次演示）');else if(a!=='cancel')openPage(a)}let a=b.dataset.action;if(a==='detailback')back();if(a==='return'){stack=[];renderMaster();renderDetail()}if(a==='retry'||a==='login'){scenario='normal';$('scenario').value='normal';renderMaster();renderDetail();toast(a==='login'?'已进入登录状态演示':'重新加载成功')}if(a==='chatmenu')modal('聊天操作',[['聊天设置','聊天设置']]);if(a==='block')modal('加入黑名单？',[['确认加入','block']]);if(a==='attach')toast('图片选择入口（原型未访问设备相册）');if(a==='emoji'){let input=document.querySelector('#composer input');input.value+='😊';input.focus()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='replyform'){if($('replyinput').value.trim()){closeModal();toast('回复已发送（仅本次演示）')}return}if(e.target.id==='composer'){let input=e.target.elements.message,v=input.value.trim();if(!v)return;let id=stack.at(-1).id;(messages[id]??=[]).push(v);renderDetail();document.querySelector('#composer input').focus()}if(e.target.id==='keywordform'){let v=e.target.querySelector('input').value.trim();if(v&&!keywords.includes(v)){keywords.push(v);renderDetail()}else toast(v?'已存在该屏蔽词':'请输入屏蔽词')}});
$('scenario').onchange=e=>{clearTimeout(loadingTimer);scenario=e.target.value;renderMaster();renderDetail();if(scenario==='loading')loadingTimer=setTimeout(()=>{scenario='normal';$('scenario').value='normal';renderMaster();renderDetail()},1500)};$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('overlay').classList.contains('show')?closeModal():back()}});renderMaster();renderDetail();
</script>
</body></html>
