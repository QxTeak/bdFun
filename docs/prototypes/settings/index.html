<script>
const categories=JSON.parse(document.querySelector('#settings-data').textContent);
const $=s=>document.querySelector(s),device=$('#device'),query=$('#query');
let selected=categories[0],scope=null,toastTimer;
const values=Object.fromEntries(categories.flatMap(c=>c.groups.flatMap(g=>g.settings.map(s=>[s.pref_name,s.default]))));
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function notify(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').style.display='none',1800)}
function navigation(){const nav=$('#categories');nav.replaceChildren();categories.forEach(c=>{let b=el('button','category'+(selected===c?' selected':''));b.append(el('span','icon',c.icon||'◈'));let label=el('span');label.append(el('strong','',c.name),el('small','',c.groups.flatMap(g=>g.settings).slice(0,3).map(s=>s.title).join('、')));b.append(label,el('span','chevron','›'));b.onclick=()=>openCategory(c);nav.append(b)})}
function openCategory(c,key){selected=c;device.classList.add('detail');closeSearch();navigation();render();if(key){const target=document.getElementById('setting-'+key);target?.scrollIntoView({block:'center',behavior:'smooth'});target?.classList.add('spotlight')}}
function render(){const pane=$('#pane');pane.replaceChildren();pane.append(el('div','breadcrumb','设置 / '+selected.name));let head=el('div','pagehead'),back=el('button','round back','‹');back.ariaLabel='返回设置分类';back.onclick=()=>device.classList.remove('detail');let tools=el('div','headtools'),search=el('button','round','⌕');search.ariaLabel='搜索当前分类';search.onclick=()=>startSearch(selected.route);tools.append(search);head.append(back,el('h2','',selected.name),tools);pane.append(head);selected.groups.forEach(g=>{pane.append(el('h3','',g.title));const card=el('div','card');g.settings.forEach(s=>{let row=el('div','row');row.id='setting-'+s.pref_name;let label=el('div','label');label.append(el('strong','',s.title));if(s.subtitle)label.append(el('small','',s.subtitle));row.append(label);if(s.type==='boolean'){let sw=el('button','switch');sw.setAttribute('role','switch');sw.setAttribute('aria-checked',String(values[s.pref_name]));sw.ariaLabel=s.title;sw.onclick=()=>{values[s.pref_name]=!values[s.pref_name];sw.setAttribute('aria-checked',String(values[s.pref_name]))};row.append(sw)}else if(s.type==='select'){let choice=el('button','choice',(s.options.find(o=>o.value===values[s.pref_name])?.title||'选择')+' ›');choice.ariaLabel=s.title;choice.onclick=()=>renderOptions(s);row.append(choice)}card.append(row)});pane.append(card)});pane.append(el('p','hint','设置值即时更新 · 原型不会修改你的应用配置'))}
function renderOptions(setting){const pane=$('#pane');pane.replaceChildren(el('div','breadcrumb','设置 / '+selected.name+' / '+setting.title));const head=el('div','pagehead'),back=el('button','round','‹');back.ariaLabel='返回'+selected.name;back.onclick=render;head.append(back,el('h2','',setting.title));pane.append(head);const card=el('div','card');setting.options.forEach(o=>{let b=el('button','row');b.style.width='100%';b.style.background='transparent';b.style.textAlign='left';b.setAttribute('aria-pressed',String(values[setting.pref_name]===o.value));b.append(el('span','label',o.title),el('span','',values[setting.pref_name]===o.value?'✓':''));b.onclick=()=>{values[setting.pref_name]=o.value;renderOptions(setting)};card.append(b)});pane.append(card)}
function startSearch(route=null){scope=route;query.placeholder=scope?'在'+selected.name+'中搜索':'搜索全部设置';device.classList.add('searching');query.focus();showResults();syncIme()}
function closeSearch(){device.classList.remove('searching');query.value='';query.blur();$('#dock').classList.remove('ime')}
function showResults(){const result=$('#results');result.replaceChildren(el('div','breadcrumb',scope?'设置 / '+selected.name:'全部设置'),el('h2','',query.value.trim()?'搜索结果':'想调整什么？'));let words=query.value.trim().toLowerCase().split(/\s+/).filter(Boolean),hits=[];if(words.length)categories.filter(c=>!scope||c.route===scope).forEach(c=>c.groups.forEach(g=>g.settings.forEach(s=>{if(words.every(w=>[c.name,g.title,s.title,s.subtitle||'',s.pref_name].join(' ').toLowerCase().includes(w)))hits.push({c,g,s})})));if(!words.length){result.append(el('p','hint','搜索名称、说明或关键词，例如「后台播放」「主题」。'));return}result.append(el('p','hint',hits.length+' 个匹配设置'));hits.forEach(({c,g,s})=>{let b=el('button','result');b.append(el('strong','',s.title),el('small','',c.name+' › '+g.title));b.onclick=()=>openCategory(c,s.pref_name);result.append(b)});if(!hits.length)result.append(el('p','empty','没有找到相关设置，试试其他关键词'))}
function syncIme(){const simulated=device.classList.contains('sim-ime')&&device.classList.contains('phone');$('#dock').classList.toggle('ime',simulated&&device.classList.contains('searching'))}
query.addEventListener('focus',()=>{if(!device.classList.contains('searching'))startSearch()});query.addEventListener('input',showResults);query.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});$('#close').onclick=closeSearch;
$('#layout').onclick=()=>{device.classList.toggle('phone');$('#layout').textContent=device.classList.contains('phone')?'横屏预览':'竖屏预览';syncIme()};$('#theme').onclick=()=>{device.classList.toggle('dark');$('#theme').textContent=device.classList.contains('dark')?'浅色':'深色'};$('#ime').onclick=()=>{device.classList.toggle('sim-ime');syncIme();notify(device.classList.contains('sim-ime')?'键盘模拟已开启':'键盘模拟已关闭')};
if(window.innerWidth<720)$('#layout').click();navigation();render();
// 实机浏览器由可视视口驱动抬升；桌面模拟仅用于检视胶囊分裂的交互。
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(!device.classList.contains('phone')||device.classList.contains('sim-ime'))return;const inset=Math.max(0,innerHeight-window.visualViewport.height-window.visualViewport.offsetTop);$('#dock').style.bottom=(22+inset)+'px'});
</script>
</html>
