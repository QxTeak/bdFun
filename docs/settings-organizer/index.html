<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bdFun 设置编排</title><link rel="stylesheet" href="organizer.css"></head>
<body><header class="toolbar"><div><strong>bdFun <span>/ 设置编排</span></strong><p id="status" role="status">正在读取完整设置索引</p></div><div class="toolbar-actions"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><label class="button">导入 JSON<input id="import" type="file" accept="application/json,.json" hidden></label><button id="reset">恢复默认布局</button><button class="primary" id="export">导出索引</button></div></header>
<main><section class="structure"><div class="sectionhead"><div><h1>页面结构</h1><p>拖动调整顺序，也可用上移 / 下移按钮</p></div><button id="add-category">添加分类</button></div><input id="filter" class="filter" placeholder="定位设置名称或存储键" aria-label="定位设置"><div id="tree"></div></section><section class="inspector"><div class="sectionhead"><div><h2>编排属性</h2><p>选择分类、分组或设置进行编辑</p></div></div><div id="properties"></div><details><summary>导出内容</summary><textarea id="json" readonly aria-label="当前索引 JSON"></textarea></details><p class="footnote">控件类型、选项、默认值和显隐条件来自现有实现。这里只调整组织与文案，导出的文件替换 App 资产后构建生效。</p></section><section class="preview"><div class="sectionhead"><div><h2>实时预览</h2><p>可点击 dropdown、开关和底部搜索</p></div><div class="preview-tools"><button id="orientation">横屏</button><button id="theme">深色</button></div></div><iframe id="preview" title="设置实时预览" src="preview.html?embedded=1"></iframe></section></main>
<div id="notice" role="alert" hidden></div>
<script src="catalog.js"></script><script src="schema.js"></script><script src="organizer.js"></script></body></html>
